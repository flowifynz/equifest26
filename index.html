<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1747">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equifest Planner">
<title>Equifest 2026 Planner</title>
<style>
:root{
  --ink:#1b1747; --muted:#5d5a7a; --bg:#f4f3f8; --card:#fff; --line:#e3e1ee; --line2:#c9c5dd;
  --edu:#2fa84f; --demo:#f28a1e; --comp:#1fb0e6; --feat:#e0207f; --night:#3a2f9e;
  --p0:#8b4513; --p1:#2b3a67; --warn:#b3261e; --warnbg:#fdecea; --head:#fff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#f0eefc; --muted:#a9a5cc; --bg:#12102a; --card:#1c1941; --line:#302c5c; --line2:#463f85;
    --warn:#ffb4ab; --warnbg:#3b1a1c; --head:#161335; --p0:#c9783d; --p1:#7e92d6; --night:#4a3fc0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 "Avenir Next","Avenir","Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--comp);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--head);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:20px;line-height:1.1;font-weight:850;letter-spacing:-.02em}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.scope{display:flex;gap:8px;margin:8px 0 8px}
.scope button{flex:1;min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.scope button[aria-pressed=true]{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#fff}
.scope .dot{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.scope button[aria-pressed=true] .dot{background:#fff;color:var(--c,var(--ink))}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.days button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative}
.days b{font-size:16px;font-weight:800}
.days span{font-size:12px;color:var(--muted)}
.days button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button[aria-selected=true] span{color:inherit;opacity:.8}
.days .n{position:absolute;top:-7px;right:-4px;min-width:22px;height:22px;border-radius:11px;padding:0 6px;
  background:var(--feat);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--head)}

/* ---------- filters ---------- */
main{padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.finder{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.finder input,.finder select{width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 6px;color:var(--muted);font-size:13px}
.link-btn{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;padding:8px 2px;min-height:40px}

/* ---------- list ---------- */
.hour{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:800;font-size:15px;color:var(--muted)}
.hour::after{content:"";flex:1;height:1px;background:var(--line)}
button.hour{width:100%;background:none;border:0;padding:8px 0;min-height:44px;text-align:left;font:inherit;font-weight:800;font-size:15px;color:var(--muted)}
button.hour .chev{font-size:13px;color:var(--ink);text-decoration:underline;order:2}
button.hour::after{order:1}
.card{--c:var(--edu);display:grid;grid-template-columns:62px 1fr 48px;gap:10px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;
  padding:12px 10px 12px 10px;margin-bottom:10px}
.card.demo{--c:var(--demo)} .card.competition{--c:var(--comp)} .card.feature{--c:var(--feat)} .card.night{--c:var(--night)}
.card.now{box-shadow:0 0 0 3px var(--c)}
.rail{text-align:left;line-height:1.1}
.rail b{display:block;font-size:22px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rail em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.rail small{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
.body h3{margin:0 0 2px;font-size:16.5px;line-height:1.25;font-weight:750}
.body p{margin:0;font-size:14px;color:var(--muted)}
.body .where{margin-top:3px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.tag.cat{background:var(--c);color:#102;}
.card.feature .tag.cat,.card.night .tag.cat{color:#fff}
.tag.live{background:#1a7f37;color:#fff}
.clash{margin-top:7px;padding:6px 9px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:650}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.pick{width:46px;height:46px;border-radius:50%;border:2px solid var(--line2);background:var(--card);display:grid;place-items:center;transition:transform .12s}
.pick:active{transform:scale(.9)}
.pick svg{width:24px;height:24px}
.pick .chk{display:none}
.pick[aria-pressed=true]{background:var(--who);border-color:var(--who);color:#fff}
.pick[aria-pressed=true] .plus{display:none}
.pick[aria-pressed=true] .chk{display:block}
.avs{display:flex}
.av{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card);margin-left:-5px}
.avs .av:first-child{margin-left:0}
.card.night{background:var(--night);color:#fff;border-color:var(--night)}
.card.night .rail em,.card.night .rail small,.card.night .body p{color:#e1ddff}
.card.night .body .where{color:#fff}
.card.night .tag{background:rgba(255,255,255,.2);color:#fff}
.card.night .pick{background:transparent;border-color:#fff;color:#fff}
.card.night .pick[aria-pressed=true]{background:#fff;color:var(--night);border-color:#fff}
.card.night .av{border-color:var(--night)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:19px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:750}
.btn.alt{background:transparent;color:var(--ink)}
.foot{margin:22px 0 6px;font-size:13px;color:var(--muted)}
.foot a{color:inherit}

/* ---------- plan ---------- */
.planhead h2{margin:4px 0 2px;font-size:20px}
.planhead p{margin:0 0 10px;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px;padding:0 10px;font-size:15px}
.dayhead{margin:22px 0 8px;font-size:18px;font-weight:850;display:flex;justify-content:space-between;align-items:baseline}
.dayhead small{font-size:13px;color:var(--muted);font-weight:600}
.gap{margin:-2px 0 8px 22px;padding-left:14px;border-left:3px dotted var(--line2);font-size:13px;color:var(--muted);min-height:20px}
.card.both{box-shadow:0 0 0 2px var(--ink)}

/* ---------- tab bar, toast, sheet ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--head);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:8px}
.tabbar button{min-height:52px;border-radius:12px;border:0;background:transparent;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabbar .cnt{background:var(--feat);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 6px;font-size:12px;display:inline-grid;place-items:center}
.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:12px 14px;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:none}
.banner{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.banner p{margin:0 0 10px;font-weight:650}
.banner .row{display:flex;gap:8px}
.banner .btn{background:var(--bg);color:var(--ink);border-color:var(--bg);min-height:42px;flex:1}
.banner .btn.alt{background:transparent;color:var(--bg)}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));background:var(--card);color:var(--ink);max-height:86vh}
dialog::backdrop{background:rgba(10,8,40,.55)}
.sheet{padding:16px}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.sheet input{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:0 12px}
.sheet .links{display:grid;gap:8px;margin:12px 0}
.sheet .links a{display:block;padding:12px;border-radius:10px;border:1px solid var(--line);color:var(--ink);font-weight:650;text-decoration:none}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row .btn{flex:1}
.danger{border-color:var(--warn)!important;color:var(--warn)!important;background:transparent!important}
@media (max-height:700px){.brand p{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:760px){.top,.tabbar{padding-left:calc(50% - 360px);padding-right:calc(50% - 360px)}main{max-width:720px;margin:0 auto}}
.scope button[data-scope=both][aria-pressed=true]{color:var(--bg)}
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="brand">
      <h1>Equifest 2026</h1>
      <p>Claudelands Events Centre, Hamilton</p>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings and links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="scope" id="scope" role="group" aria-label="Whose plan"></div>
  <div class="days" id="days" role="tablist" aria-label="Day"></div>
</header>

<main id="main"></main>

<nav class="tabbar" role="tablist" aria-label="View">
  <button role="tab" id="tabBrowse" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Browse
  </button>
  <button role="tab" id="tabPlan" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 13"/></svg>
    My plan <span class="cnt" id="planCnt">0</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <label for="n0">First person</label><input id="n0" maxlength="14" autocomplete="off">
    <label for="n1">Second person</label><input id="n1" maxlength="14" autocomplete="off">
    <div class="links">
      <a href="https://www.equifest.co.nz/map/" target="_blank" rel="noopener">Venue map</a>
      <a href="https://www.equifest.co.nz/timetable/" target="_blank" rel="noopener">Official timetable (check for changes)</a>
      <a href="https://www.equifest.co.nz/plan-your-visit/" target="_blank" rel="noopener">Gates and parking</a>
    </div>
    <div class="row">
      <button class="btn danger" id="clear0"></button>
      <button class="btn danger" id="clear1"></button>
    </div>
    <div class="row"><button class="btn" id="closeSettings">Done</button></div>
  </div>
</dialog>

<script src="events.js"></script>
<script>
(() => {
'use strict';
const EV = window.EQUIFEST_EVENTS || [];
const DAYS = [
  {k:'fri', name:'Friday',   short:'Fri', date:16, iso:'2026-10-16'},
  {k:'sat', name:'Saturday', short:'Sat', date:17, iso:'2026-10-17'},
  {k:'sun', name:'Sunday',   short:'Sun', date:18, iso:'2026-10-18'}
];
const CATS = {
  education:{label:'Education', c:'var(--edu)'},
  demo:{label:'Demos', c:'var(--demo)'},
  competition:{label:'Competitions', c:'var(--comp)'},
  feature:{label:'Features', c:'var(--feat)'},
  night:{label:'Night shows', c:'var(--night)'}
};
const CAT_ONE = {education:'Education',demo:'Demo',competition:'Competition',feature:'Feature',night:'Night show'};
const KEY = 'equifest26-planner-v1';
const mins = s => +s.slice(0,2)*60 + +s.slice(3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

// derive fields
const ARENAS = [];
EV.forEach(e => {
  e.s = mins(e.start);
  e.e = e.end ? mins(e.end) : e.s + 120;
  if (!ARENAS.includes(e.arena)) ARENAS.push(e.arena);
});
const BY_ID = Object.fromEntries(EV.map(e => [e.id, e]));

function t12(m){ const h=Math.floor(m/60), mm=m%60; return {t:`${h%12||12}:${String(mm).padStart(2,'0')}`, ap:h>=12?'pm':'am'}; }
function rangeText(e){
  const a=t12(e.s); if(!e.end) return `${a.t} ${a.ap}`;
  const b=t12(e.e); return a.ap===b.ap ? `${a.t}–${b.t} ${b.ap}` : `${a.t} ${a.ap} – ${b.t} ${b.ap}`;
}
function dur(e){ const d=e.e-e.s; return d<60 ? `${d} min` : `${Math.floor(d/60)}h${d%60?` ${d%60}m`:''}`; }

// ---------- state ----------
const DEF = {names:['Mum','Daughter'], picks:[[],[]], day:'fri', scope:0, last:0};
let S; try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)||'{}')); } catch { S = {...DEF}; }
S.picks = [0,1].map(i => (S.picks?.[i]||[]).filter(id => BY_ID[id]));
S.names = [0,1].map(i => (S.names?.[i]||DEF.names[i]));
const todayIso = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
const todayDay = DAYS.find(d => d.iso === todayIso);
if (todayDay) S.day = todayDay.k;
let view = 'browse';
const F = {cats:new Set(), arena:'', q:'', drop:false};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({names:S.names,picks:S.picks,day:S.day,scope:S.scope,last:S.last})); } catch {} };
const active = () => S.scope === 'both' ? S.last : S.scope;
const has = (i,id) => S.picks[i].includes(id);
const PCOL = ['var(--p0)','var(--p1)'];
const ini = i => (S.names[i].trim()[0] || String(i+1)).toUpperCase();

// ---------- logic ----------
const overlaps = (a,b) => !a.dropin && !b.dropin && a.s < b.e && b.s < a.e;
function clashes(e, i){ return S.picks[i].map(id=>BY_ID[id]).filter(o => o.id!==e.id && o.day===e.day && overlaps(e,o)); }
function nowState(e){
  const d = DAYS.find(x=>x.k===e.day);
  if (!d || d.iso !== todayIso) return '';
  const n = new Date(), m = n.getHours()*60 + n.getMinutes();
  return (m >= e.s && m < e.e) ? 'now' : '';
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2800); }

function toggle(id){
  const i = active(), arr = S.picks[i], k = arr.indexOf(id), e = BY_ID[id];
  if (k >= 0){ arr.splice(k,1); toast(`Removed from ${S.names[i]}’s plan`); }
  else {
    arr.push(id);
    const c = clashes(e,i);
    toast(c.length ? `Added, but it overlaps ${c[0].title}` : `Added to ${S.names[i]}’s plan`);
  }
  save(); render();
}

// ---------- icons ----------
const PLUS = '<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const CHK = '<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---------- card ----------
function card(e, mode){
  const i = active(), picked = has(i,e.id);
  const who = [0,1].filter(x => has(x,e.id));
  const live = nowState(e);
  const a = t12(e.s);
  let cl = '';
  if (mode === 'plan' && S.scope === 'both') {
    cl = who.map(x => { const c = clashes(e,x); return c.length ? `<div class="clash">${esc(S.names[x])}: clashes with ${esc(c[0].title)}</div>` : ''; }).join('');
  } else {
    const c = clashes(e,i);
    if (c.length) cl = `<div class="clash">${picked?'Clashes with':'Overlaps'} ${esc(c[0].title)} (${t12(c[0].s).t})${c.length>1?` and ${c.length-1} more`:''}</div>`;
  }
  const sub = e.cat==='night' ? `<p>Doors open 6 pm. Show starts 6:30 pm.</p>` : '';
  const railSub = e.dropin ? `<small>to ${t12(e.e).t}${t12(e.e).ap}</small>` : (e.end ? `<small>${dur(e)}</small>` : '');
  const tags = [`<span class="tag cat">${CAT_ONE[e.cat]}</span>`];
  if (live) tags.push('<span class="tag live">On now</span>');
  if (e.dropin) tags.push('<span class="tag">Drop in any time</span>');
  if (who.length===2 && S.scope==='both') tags.push('<span class="tag">Going together</span>');
  const avs = who.length && (S.scope==='both' || who.some(x=>x!==i) ) ? `<div class="avs" aria-hidden="true">${who.map(x=>`<span class="av" style="--c:${PCOL[x]}">${esc(ini(x))}</span>`).join('')}</div>` : '';
  let btn = '';
  if (S.scope !== 'both') {
    const lbl = `${picked?'Remove':'Add'} ${e.title} ${picked?'from':'to'} ${S.names[i]}’s plan`;
    btn = `<button class="pick" style="--who:${PCOL[i]}" data-id="${e.id}" aria-pressed="${picked}" aria-label="${esc(lbl)}">${PLUS}${CHK}</button>`;
  }
  return `<article class="card ${e.cat}${live?' now':''}${who.length===2&&S.scope==='both'?' both':''}" data-s="${e.s}">
    <div class="rail"><b>${a.t}</b><em>${a.ap}</em>${railSub}</div>
    <div class="body">
      <h3>${esc(e.title)}</h3>
      ${e.who ? `<p>${esc(e.who)}</p>` : ''}${sub}
      <p class="where">${esc(e.arena)}</p>
      <div class="tags">${tags.join('')}</div>${cl}
    </div>
    <div class="side">${btn}${avs}</div>
  </article>`;
}

// ---------- header ----------
function renderHeader(){
  const sc = $('scope');
  const opts = [0,1].map(i => `<button style="--c:${PCOL[i]}" data-scope="${i}" aria-pressed="${S.scope===i}"><span class="dot">${esc(ini(i))}</span>${esc(S.names[i])}</button>`);
  if (view === 'plan') opts.push(`<button data-scope="both" aria-pressed="${S.scope==='both'}">Together</button>`);
  sc.innerHTML = opts.join('');
  const ids = S.scope === 'both' ? new Set([...S.picks[0], ...S.picks[1]]) : new Set(S.picks[S.scope]);
  $('days').innerHTML = DAYS.map(d => {
    const n = EV.filter(e => e.day===d.k && ids.has(e.id)).length;
    return `<button role="tab" data-day="${d.k}" aria-selected="${S.day===d.k}"><b>${d.name}</b><span>${d.date} Oct</span>${n?`<i class="n" aria-label="${n} picked">${n}</i>`:''}</button>`;
  }).join('');
  $('planCnt').textContent = ids.size;
  $('tabBrowse').setAttribute('aria-selected', view==='browse');
  $('tabPlan').setAttribute('aria-selected', view==='plan');
}

// ---------- browse ----------
function filtered(){
  const q = F.q.trim().toLowerCase();
  return EV.filter(e => e.day===S.day
    && (!F.cats.size || F.cats.has(e.cat))
    && (!F.arena || e.arena===F.arena)
    && (!q || (e.title+' '+e.who+' '+e.arena).toLowerCase().includes(q)))
   .sort((a,b)=>a.s-b.s || ARENAS.indexOf(a.arena)-ARENAS.indexOf(b.arena));
}
function renderBrowse(){
  const m = $('main');
  if (!m.querySelector('#finder')) {
    m.innerHTML = `
      <div id="bannerSlot"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
      <div class="finder" id="finder">
        <input id="q" type="search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off">
        <select id="arena" aria-label="Filter by arena"><option value="">All arenas</option>${ARENAS.map(a=>`<option>${esc(a)}</option>`).join('')}</select>
        
      </div>
      <div class="meta"><span id="count"></span><span><button class="link-btn" id="clearF" hidden>Clear filters</button> <button class="link-btn" id="jump" hidden>Jump to now</button></span></div>
      <div id="list"></div>`;
    $('q').value = F.q; $('arena').value = F.arena;
    showBanner();
  }
  $('chips').innerHTML = Object.entries(CATS).map(([k,v]) => `<button class="chip" data-cat="${k}" aria-pressed="${F.cats.has(k)}"><i style="--c:${v.c}"></i>${v.label}</button>`).join('');
  const list = filtered();
  $('count').textContent = `${list.length} session${list.length===1?'':'s'} on ${DAYS.find(d=>d.k===S.day).name}`;
  $('jump').hidden = !(todayDay && todayDay.k===S.day);
  const drop = list.filter(e=>e.dropin), rest = list.filter(e=>!e.dropin);
  let html = '';
  const filtering = !!(F.q || F.arena || F.cats.size);
  const dropOpen = F.drop || filtering;
  $('clearF').hidden = !filtering;
  if (drop.length) html += `<button class="hour" id="dropToggle" aria-expanded="${dropOpen}">On all day (${drop.length}) <span class="chev">${dropOpen?'Hide':'Show'}</span></button>` + (dropOpen ? drop.map(e=>card(e,'browse')).join('') : '');
  let h = -1;
  rest.forEach(e => {
    const hr = Math.floor(e.s/60);
    if (hr !== h){ h = hr; const t=t12(hr*60); html += `<div class="hour">${t.t.replace(':00','')} ${t.ap}</div>`; }
    html += card(e,'browse');
  });
  if (!list.length) html = `<div class="empty"><h2>Nothing matches</h2><p>Try a different search or clear the filters.</p></div>`;
  html += `<p class="foot">Times are from the official timetable PDF and may change. Check <a href="https://www.equifest.co.nz/timetable/" target="_blank" rel="noopener">equifest.co.nz/timetable</a> on the day.</p>`;
  $('list').innerHTML = html;
}

// ---------- plan ----------
function planList(){
  const ids = S.scope==='both' ? new Set([...S.picks[0],...S.picks[1]]) : new Set(S.picks[S.scope]);
  return EV.filter(e=>ids.has(e.id));
}
function renderPlan(){
  const m = $('main'), list = planList();
  const who = S.scope==='both' ? 'Together' : `${S.names[S.scope]}’s plan`;
  let html = `<div id="bannerSlot"></div><div class="planhead"><h2>${esc(who)}</h2><p>${list.length} session${list.length===1?'':'s'} picked`;
  if (S.scope==='both'){ const both = S.picks[0].filter(id=>S.picks[1].includes(id)).length; html += `, ${both} in common`; }
  html += `</p></div>`;
  if (!list.length){
    html += `<div class="empty"><h2>Nothing picked yet</h2><p>Go to Browse and tap the + on any session to add it here.</p><button class="btn" id="goBrowse">Browse sessions</button></div>`;
    m.innerHTML = html; showBanner(); return;
  }
  html += `<div class="actions"><button class="btn" id="ics">Add to calendar</button><button class="btn alt" id="share">Share plans</button></div>`;
  DAYS.forEach(d => {
    const items = list.filter(e=>e.day===d.k).sort((a,b)=>a.s-b.s || a.e-b.e);
    if (!items.length) return;
    html += `<div class="dayhead"><span>${d.name} ${d.date} October</span><small>${items.length} session${items.length===1?'':'s'}</small></div>`;
    let prev = null;
    items.forEach(e => {
      if (prev && !e.dropin && !prev.dropin && e.s - prev.e >= 30) html += `<div class="gap">${e.s-prev.e} min free</div>`;
      html += card(e,'plan');
      if (!e.dropin) prev = e;
    });
  });
  m.innerHTML = html; showBanner();
}

// ---------- share / calendar ----------
function shareUrl(){
  const json = JSON.stringify({n:S.names, p:S.picks});
  return location.origin + location.pathname + '#s=' + encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
}
async function doShare(){
  const url = shareUrl();
  try {
    if (navigator.share) { await navigator.share({title:'Equifest 2026 plan', text:'Our Equifest plan', url}); return; }
  } catch(e){ if (e && e.name==='AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it into a message.'); }
  catch { prompt('Copy this link', url); }
}
function parseShared(){
  const m = location.hash.match(/^#s=(.+)$/); if(!m) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (o && Array.isArray(o.p)) return o; } catch {}
  return null;
}
let shared = parseShared();
function showBanner(){
  const slot = $('bannerSlot'); if (!slot) return; if (!shared){ slot.innerHTML=''; return; }
  const n = (shared.p[0]||[]).length + (shared.p[1]||[]).length;
  slot.innerHTML = `<div class="banner"><p>Someone shared a plan with ${n} pick${n===1?'':'s'}. Replace the plans on this phone?</p><div class="row"><button class="btn" id="bYes">Use shared plan</button><button class="btn alt" id="bNo">No thanks</button></div></div>`;
}
function ics(list){
  const pad=n=>String(n).padStart(2,'0'), esc2=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Equifest Planner//EN','CALSCALE:GREGORIAN'];
  list.forEach(e => {
    const d = DAYS.find(x=>x.k===e.day).iso.replace(/-/g,'');
    const f = m => `${d}T${pad(Math.floor(m/60))}${pad(m%60)}00`;
    const desc = [e.who, e.cat==='night'?'Doors open 6pm. End time not published.':''].filter(Boolean).join('\n');
    lines.push('BEGIN:VEVENT',`UID:${e.id}@equifest-planner`,`DTSTAMP:${stamp}`,`DTSTART:${f(e.s)}`,`DTEND:${f(e.e)}`,
      `SUMMARY:${esc2(e.title)}`,`LOCATION:${esc2(e.arena+', Claudelands Events Centre, Hamilton')}`,`DESCRIPTION:${esc2(desc)}`,'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs(){
  const list = planList(); if(!list.length) return;
  const blob = new Blob([ics(list)], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `equifest-${S.scope==='both'?'together':S.names[S.scope].toLowerCase().replace(/\W+/g,'-')}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

// ---------- render ----------
function render(){
  if (view==='browse' && S.scope==='both') S.scope = S.last;
  if (S.scope !== 'both') S.last = S.scope;
  renderHeader();
  if (view==='browse') renderBrowse(); else renderPlan();
}
function setView(v){ view=v; $('main').innerHTML=''; render(); window.scrollTo({top:0}); }

// ---------- events ----------
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if(!t) return;
  if (t.dataset.id) return toggle(t.dataset.id);
  if (t.dataset.scope !== undefined){ S.scope = t.dataset.scope==='both' ? 'both' : +t.dataset.scope; save(); return render(); }
  if (t.dataset.day){ S.day = t.dataset.day; save(); render(); return window.scrollTo({top:0}); }
  if (t.dataset.cat){ F.cats.has(t.dataset.cat) ? F.cats.delete(t.dataset.cat) : F.cats.add(t.dataset.cat); return render(); }
  switch (t.id){
    case 'tabBrowse': return setView('browse');
    case 'tabPlan': return setView('plan');
    case 'goBrowse': return setView('browse');
    case 'clearF': F.cats.clear(); F.q=''; F.arena=''; $('q').value=''; $('arena').value=''; return render();
    case 'jump': {
      const n = new Date(), m = n.getHours()*60+n.getMinutes();
      const c = [...document.querySelectorAll('#list .card')].find(x => +x.dataset.s + 0 >= m - 30) || document.querySelector('#list .card');
      if (c) c.scrollIntoView({block:'center', behavior:'smooth'}); return;
    }
    case 'dropToggle': F.drop = !F.drop; return renderBrowse();
    case 'share': return doShare();
    case 'ics': return downloadIcs();
    case 'bYes': S.names = [0,1].map(i=>String(shared.n?.[i]||S.names[i]).slice(0,14)); S.picks = [0,1].map(i=>(shared.p[i]||[]).filter(id=>BY_ID[id])); shared=null; history.replaceState(null,'',location.pathname); save(); toast('Shared plan loaded'); return render();
    case 'bNo': shared=null; history.replaceState(null,'',location.pathname); return render();
    case 'openSettings': $('n0').value=S.names[0]; $('n1').value=S.names[1]; $('clear0').textContent=`Clear ${S.names[0]}’s picks`; $('clear1').textContent=`Clear ${S.names[1]}’s picks`; return $('settings').showModal();
    case 'closeSettings': return $('settings').close();
    case 'clear0': case 'clear1': { const i=+t.id.slice(-1); if (confirm(`Clear all of ${S.names[i]}’s picks?`)){ S.picks[i]=[]; save(); render(); toast('Picks cleared'); } return; }
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id==='q'){ F.q = ev.target.value; renderBrowse(); }
  if (ev.target.id==='n0' || ev.target.id==='n1'){
    const i = +ev.target.id.slice(1); S.names[i] = ev.target.value.trim() || DEF.names[i]; save(); renderHeader();
    $('clear'+i).textContent = `Clear ${S.names[i]}’s picks`;
  }
});
document.addEventListener('change', ev => { if (ev.target.id==='arena'){ F.arena = ev.target.value; renderBrowse(); } });
$('settings').addEventListener('close', render);
setInterval(() => { if (!document.hidden && todayDay) render(); }, 60000);

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
